<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Najah — mode concentration</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap">
<style>body{margin:0;background:#FCFBF8}a{color:#0E6B5C}a:hover{color:#0A5247}</style>
</helmet>
<div style="width: 393px; height: 1060px; box-sizing: border-box; background: #FCFBF8; font-family: Inter, 'Segoe UI', sans-serif; color: #10231F; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 4px">
<a href="ChildProgress.dc.html" aria-label="Retour" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #10231F">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="font-size: 16px; font-weight: 700">Amina</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Mode concentration</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5B6663">Pendant ces créneaux, Najah reste ouvert sur le téléphone d'Amina. Elle ne peut en sortir qu'avec votre code.</p>
</div>

<div style="padding: 16px; background: #FFFFFF; border-radius: 12px; border: 1px solid #ECE8DF; display: flex; align-items: center; gap: 12px">
<label for="focus-on" style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">Activer le mode concentration</span>
<span style="font-size: 12px; color: #5B6663">{{ statusText }}</span>
</label>
<button id="focus-on" type="button" role="switch" aria-checked="{{ onAria }}" onClick="{{ toggle }}" style="width: 52px; height: 32px; border-radius: 16px; border: none; padding: 3px; background: {{ trackBg }}; display: flex; justify-content: {{ knobSide }}; cursor: pointer">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.2)"></span>
</button>
</div>

<div style="padding: 16px; background: #FFFFFF; border-radius: 12px; border: 1px solid #ECE8DF; display: flex; flex-direction: column; gap: 16px; opacity: {{ sectionOpacity }}">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Créneau 1</h2>
<button type="button" aria-label="Supprimer le créneau" style="width: 44px; height: 44px; margin-right: -10px; border: none; background: transparent; color: #5B6663; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
</div>
<div style="display: flex; justify-content: space-between">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<button type="button" onClick="{{ d.flip }}" aria-pressed="{{ d.pressed }}" aria-label="{{ d.full }}" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid {{ d.border }}; background: {{ d.bg }}; color: {{ d.fg }}; font: 700 14px Inter, sans-serif; cursor: pointer">{{ d.l }}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<label for="t1" style="font-size: 12px; font-weight: 600; color: #5B6663">Début</label>
<input id="t1" value="17:00" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #ECE8DF; border-radius: 12px; font: 700 18px Inter, sans-serif; color: #10231F; background: #FCFBF8">
</div>
<svg style="margin-top: 22px" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6663" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<label for="t2" style="font-size: 12px; font-weight: 600; color: #5B6663">Fin</label>
<input id="t2" value="19:00" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #ECE8DF; border-radius: 12px; font: 700 18px Inter, sans-serif; color: #10231F; background: #FCFBF8">
</div>
</div>
</div>
<a href="#" style="height: 48px; border-radius: 12px; border: 1.5px solid #10231F; color: #10231F; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Ajouter un créneau</a>

<a href="#" style="padding: 16px; background: #FFFFFF; border-radius: 12px; border: 1px solid #ECE8DF; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #10231F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Code parent</span><span style="font-size: 12px; color: #5B6663">Pour déverrouiller le téléphone</span></div>
<span style="font-size: 18px; letter-spacing: 4px; font-weight: 800">••••</span>
<span style="font-size: 14px; font-weight: 700; color: #0E6B5C">Modifier</span>
</a>

<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Journal</h2>
<div style="background: #FFFFFF; border-radius: 12px; border: 1px solid #ECE8DF">
<sc-for list="{{ log }}" as="e" hint-placeholder-count="3">
<div style="padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid #F1EEE6">
<div style="width: 10px; height: 10px; margin-top: 5px; border-radius: 5px; background: {{ e.dot }}; flex-shrink: 0"></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">{{ e.what }}</span><span style="font-size: 12px; color: #5B6663">{{ e.when }}</span></div>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":1060}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { on: true, days: [true, true, true, true, true, false, false] }; }
renderVals() {
const { on, days } = this.state;
const L = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const F = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
return {
toggle: () => this.setState({ on: !on }),
onAria: on ? 'true' : 'false',
trackBg: on ? '#0E6B5C' : '#C9C4B8', knobSide: on ? 'flex-end' : 'flex-start',
statusText: on ? 'Lun – Ven · 17:00 → 19:00' : 'Désactivé',
sectionOpacity: on ? '1' : '0.5',
days: days.map((sel, i) => ({
l: L[i], full: F[i], pressed: sel ? 'true' : 'false',
bg: sel ? '#10231F' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#10231F', border: sel ? '#10231F' : '#ECE8DF',
flip: () => { const d = days.slice(); d[i] = !d[i]; this.setState({ days: d }); }
})),
log: [
{ what: 'A quitté l\u2019application 2 min', when: 'Lun. 29 sept. · 18:12', dot: '#F5B83D' },
{ what: 'Déverrouillé avec votre code', when: 'Ven. 26 sept. · 17:40', dot: '#10231F' },
{ what: 'Créneau terminé normalement', when: 'Jeu. 25 sept. · 19:00', dot: '#0E6B5C' }
]
};
}
}
</script>
</body>
</html>
