<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Najah — résultat et série</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap">
<style>body{margin:0;background:#FCFBF8}a{color:#0E6B5C}a:hover{color:#0A5247}</style>
</helmet>
<div style="width: 393px; height: 852px; box-sizing: border-box; background: #FCFBF8; font-family: Inter, 'Segoe UI', sans-serif; color: #10231F; padding: 40px 24px 28px; display: flex; flex-direction: column; align-items: center; gap: 24px">
<div style="position: relative; width: 132px; height: 132px; display: flex; align-items: center; justify-content: center">
<div style="position: absolute; inset: 0; border-radius: 66px; background: #FDF1D8"></div>
<div style="position: absolute; top: 6px; left: 18px; width: 8px; height: 8px; border-radius: 4px; background: #F5B83D"></div>
<div style="position: absolute; top: 22px; right: 8px; width: 6px; height: 6px; border-radius: 3px; background: #0E6B5C"></div>
<div style="position: absolute; bottom: 14px; left: 4px; width: 6px; height: 6px; border-radius: 3px; background: #0E6B5C"></div>
<svg style="position: relative" width="72" height="72" viewBox="0 0 24 24" fill="#F5B83D" stroke="#C98A12" stroke-width="0.8" stroke-linejoin="round"><path d="M12 2.5c1.2 3.2 5.5 5.3 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.3 1.1-3.9 2.3-5 0 2.2 1 3.4 2.2 3.4 0-3.2-1.1-5.5 1-8.9z"></path></svg>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<div style="font-size: 32px; font-weight: 800; letter-spacing: -0.02em">13 jours de suite</div>
<div style="font-size: 16px; line-height: 1.5; color: #5B6663">Ta série continue. Reviens demain pour la garder.</div>
</div>
<div style="display: flex; gap: 6px" aria-label="Série de la semaine">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="width: 36px; height: 36px; border-radius: 18px; background: {{ d.bg }}; border: 2px solid {{ d.border }}; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ d.on }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10231F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
</div>
<div style="font-size: 12px; font-weight: 600; color: #5B6663">{{ d.l }}</div>
</div>
</sc-for>
</div>

<div style="width: 100%; padding: 20px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 1px 2px rgba(16,35,31,.06), 0 6px 20px rgba(16,35,31,.05); display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
<div style="font-size: 14px; font-weight: 600; color: #5B6663">Identités remarquables · QCM</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center">
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 24px; font-weight: 800; color: #0E6B5C">8/10</div><div style="font-size: 12px; font-weight: 600; color: #5B6663">Score</div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 24px; font-weight: 800">4:35</div><div style="font-size: 12px; font-weight: 600; color: #5B6663">Durée</div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 24px; font-weight: 800">+80</div><div style="font-size: 12px; font-weight: 600; color: #5B6663">XP gagnés</div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600"><span>Niveau 7</span><span style="color: #5B6663">1 320 / 1 500 XP</span></div>
<div style="height: 8px; border-radius: 4px; background: #F1EEE6"><div style="width: 88%; height: 8px; border-radius: 4px; background: #F5B83D"></div></div>
</div>
</div>

<div style="width: 100%; margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<a href="#" style="height: 52px; border-radius: 12px; border: 1.5px solid #0E6B5C; color: #0E6B5C; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Revoir mes 2 erreurs</a>
<a href="StudentHome.dc.html" style="height: 52px; border-radius: 12px; background: #0E6B5C; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Retour à l'accueil</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
renderVals() {
const labels = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const days = labels.map((l, i) => {
const on = i <= 3, today = i === 3;
return { l, on, bg: on ? '#F5B83D' : '#FFFFFF', border: today ? '#10231F' : (on ? '#F5B83D' : '#E3E0D7') };
});
return { days };
}
}
</script>
</body>
</html>
