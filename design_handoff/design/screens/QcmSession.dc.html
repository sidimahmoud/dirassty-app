<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Najah — QCM</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap">
<style>body{margin:0;background:#FCFBF8}a{color:#0E6B5C}a:hover{color:#0A5247}</style>
</helmet>
<div style="width: 393px; height: 852px; box-sizing: border-box; background: #FCFBF8; font-family: Inter, 'Segoe UI', sans-serif; color: #10231F; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="LessonVideo.dc.html" aria-label="Quitter la session" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #10231F">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
</a>
<div style="flex-grow: 1; height: 8px; border-radius: 4px; background: #F1EEE6"><div style="width: 30%; height: 8px; border-radius: 4px; background: #0E6B5C"></div></div>
<div style="font-size: 14px; font-weight: 700">3/10</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 12px; font-weight: 600; color: #5B6663">Identités remarquables · Question 3</div>
<h1 style="margin: 0; font-size: 24px; font-weight: 800; line-height: 1.3">Développe l'expression (x + 3)²</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 12px" role="radiogroup" aria-label="Réponses">
<sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
<button type="button" onClick="{{ o.pick }}" role="radio" aria-checked="{{ o.checked }}" style="min-height: 60px; padding: 12px 16px; border-radius: 12px; border: 2px solid {{ o.border }}; background: {{ o.bg }}; display: flex; align-items: center; gap: 14px; text-align: left; cursor: pointer; font-family: Inter, sans-serif; color: #10231F">
<span style="width: 32px; height: 32px; border-radius: 8px; background: {{ o.badgeBg }}; color: {{ o.badgeFg }}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{ o.key }}</span>
<span style="font-size: 18px; font-weight: 600; flex-grow: 1">{{ o.text }}</span>
<sc-if value="{{ o.showCheck }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E6B5C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
<sc-if value="{{ o.showCross }}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></sc-if>
</button>
</sc-for>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{ right }}" hint-placeholder-val="{{ false }}">
<div style="padding: 16px; border-radius: 12px; background: #E3F0ED; display: flex; flex-direction: column; gap: 6px" role="status">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 16px; font-weight: 800; color: #0A5247">Bravo, c'est juste !</span>
<span style="padding: 4px 10px; border-radius: 999px; background: #F5B83D; font-size: 12px; font-weight: 800; color: #10231F">+10 XP</span>
</div>
<div style="font-size: 14px; line-height: 1.5; color: #1E3A34">(a + b)² = a² + 2ab + b², donc (x + 3)² = x² + 2·3·x + 3² = x² + 6x + 9.</div>
</div>
</sc-if>
<sc-if value="{{ wrong }}" hint-placeholder-val="{{ false }}">
<div style="padding: 16px; border-radius: 12px; background: #FBEAE8; display: flex; flex-direction: column; gap: 6px" role="status">
<span style="font-size: 16px; font-weight: 800; color: #8C1D18">Pas tout à fait</span>
<div style="font-size: 14px; line-height: 1.5; color: #4A1512">N'oublie pas le double produit 2ab. La bonne réponse est x² + 6x + 9.</div>
</div>
</sc-if>
<sc-if value="{{ canCheck }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ check }}" style="height: 52px; border: none; border-radius: 12px; background: #0E6B5C; color: #FFFFFF; font: 700 16px Inter, sans-serif; cursor: pointer">Vérifier</button>
</sc-if>
<sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
<div style="height: 52px; border-radius: 12px; background: #E4E7E5; color: #5B6663; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center">Vérifier</div>
</sc-if>
<sc-if value="{{ checked }}" hint-placeholder-val="{{ false }}">
<a href="QcmResult.dc.html" style="height: 52px; border-radius: 12px; background: #10231F; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Continuer</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { sel: null, done: false }; }
renderVals() {
const { sel, done } = this.state;
const correct = 'B';
const raw = [['A', 'x² + 9'], ['B', 'x² + 6x + 9'], ['C', 'x² + 3x + 9'], ['D', '2x + 6']];
const options = raw.map(([key, text]) => {
const isSel = sel === key, isRight = key === correct;
let border = '#ECE8DF', bg = '#FFFFFF', badgeBg = '#F1EEE6', badgeFg = '#10231F';
if (!done && isSel) { border = '#0E6B5C'; bg = '#F6FAF9'; badgeBg = '#0E6B5C'; badgeFg = '#FFFFFF'; }
if (done && isRight) { border = '#0E6B5C'; bg = '#E3F0ED'; badgeBg = '#0E6B5C'; badgeFg = '#FFFFFF'; }
if (done && isSel && !isRight) { border = '#B3261E'; bg = '#FBEAE8'; badgeBg = '#B3261E'; badgeFg = '#FFFFFF'; }
return { key, text, border, bg, badgeBg, badgeFg, checked: isSel ? 'true' : 'false',
showCheck: done && isRight, showCross: done && isSel && !isRight,
pick: () => { if (!done) this.setState({ sel: key }); } };
});
return {
options,
check: () => this.setState({ done: true }),
canCheck: !done && sel !== null, idle: !done && sel === null, checked: done,
right: done && sel === correct, wrong: done && sel !== correct
};
}
}
</script>
</body>
</html>
