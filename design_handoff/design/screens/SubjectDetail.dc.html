<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Najah — Mathématiques</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap">
<style>body{margin:0;background:#FCFBF8}a{color:#0E6B5C}a:hover{color:#0A5247}</style>
</helmet>
<div style="width: 393px; height: 1120px; box-sizing: border-box; background: #FCFBF8; font-family: Inter, 'Segoe UI', sans-serif; color: #10231F; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 4px">
<a href="StudentHome.dc.html" aria-label="Retour" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #10231F">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<div style="font-size: 16px; font-weight: 700">Matières</div>
</div>

<div style="display: flex; align-items: center; gap: 16px">
<div style="position: relative; width: 80px; height: 80px; flex-shrink: 0">
<svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="#F1EEE6" stroke-width="7"></circle><circle cx="40" cy="40" r="34" fill="none" stroke="#0E6B5C" stroke-width="7" stroke-linecap="round" stroke-dasharray="145.3 213.6" transform="rotate(-90 40 40)"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800">68%</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800">Mathématiques</h1>
<div style="font-size: 14px; color: #5B6663">C4 · 6 chapitres · 24 leçons</div>
<div style="font-size: 12px; font-weight: 600; color: #0E6B5C">9 leçons maîtrisées</div>
</div>
</div>

<div style="display: flex; gap: 8px">
<div style="height: 32px; padding: 0 12px; border-radius: 999px; background: #10231F; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center">Toutes</div>
<div style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECE8DF; font-size: 12px; font-weight: 600; display: flex; align-items: center">À revoir</div>
<div style="height: 32px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #ECE8DF; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Hors ligne</div>
</div>

<div style="background: #FFFFFF; border-radius: 12px; border: 1px solid #ECE8DF; overflow: hidden">
<div style="padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #F1EEE6">
<div style="width: 32px; height: 32px; border-radius: 8px; background: #E3F0ED; color: #0E6B5C; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">1</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between"><span style="font-size: 16px; font-weight: 700">Calcul littéral</span><span style="font-size: 14px; font-weight: 700; color: #0E6B5C">74 %</span></div>
<div style="height: 6px; border-radius: 3px; background: #F1EEE6"><div style="width: 74%; height: 6px; border-radius: 3px; background: #0E6B5C"></div></div>
</div>
</div>
<sc-for list="{{ lessons }}" as="l" hint-placeholder-count="4">
<a href="{{ l.href }}" style="padding: 12px 16px; min-height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #10231F; border-bottom: 1px solid #F1EEE6; background: {{ l.bg }}">
<sc-if value="{{ l.mastered }}" hint-placeholder-val="{{ false }}"><div style="width: 28px; height: 28px; border-radius: 14px; background: #0E6B5C; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div></sc-if>
<sc-if value="{{ l.viewed }}" hint-placeholder-val="{{ false }}"><div style="width: 28px; height: 28px; border-radius: 14px; border: 2.5px solid #10231F; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><div style="width: 8px; height: 8px; border-radius: 4px; background: #10231F"></div></div></sc-if>
<sc-if value="{{ l.todo }}" hint-placeholder-val="{{ true }}"><div style="width: 28px; height: 28px; border-radius: 14px; border: 2px solid #C9C4B8; box-sizing: border-box; flex-shrink: 0"></div></sc-if>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 600">{{ l.title }}</div>
<div style="font-size: 12px; color: #5B6663">{{ l.meta }}</div>
</div>
<sc-if value="{{ l.offline }}" hint-placeholder-val="{{ false }}"><svg aria-label="Téléchargée" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0E6B5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></sc-if>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6663" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>

<sc-for list="{{ chapters }}" as="c" hint-placeholder-count="5">
<a href="#" style="padding: 16px; background: #FFFFFF; border-radius: 12px; border: 1px solid #ECE8DF; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #10231F">
<div style="width: 32px; height: 32px; border-radius: 8px; background: #F1EEE6; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ c.n }}</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between"><span style="font-size: 16px; font-weight: 700">{{ c.title }}</span><span style="font-size: 14px; font-weight: 700; color: #5B6663">{{ c.pctLabel }}</span></div>
<div style="height: 6px; border-radius: 3px; background: #F1EEE6"><div style="width: {{ c.pctLabel }}; height: 6px; border-radius: 3px; background: #10231F"></div></div>
<div style="font-size: 12px; color: #5B6663">{{ c.meta }}</div>
</div>
</a>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":1120}}'>
class Component extends DCLogic {
renderVals() {
const lessons = [
{ title: 'Développer une expression', meta: 'Maîtrisée · 100 %', mastered: true, offline: true },
{ title: 'Factoriser', meta: 'Maîtrisée · 92 %', mastered: true },
{ title: 'Identités remarquables', meta: 'Vue · 58 % · Reprendre', viewed: true, href: 'LessonVideo.dc.html', bg: '#F6FAF9' },
{ title: 'Calcul avec les puissances', meta: 'Non commencée · 12 min', todo: true }
].map((l) => ({ href: '#', bg: '#FFFFFF', mastered: false, viewed: false, todo: false, offline: false, ...l }));
const chapters = [
['2', 'Équations et inéquations', 70, '4 leçons · 3 maîtrisées'],
['3', 'Théorème de Pythagore', 45, '3 leçons · 1 maîtrisée'],
['4', 'Fonctions linéaires', 20, '5 leçons · en cours'],
['5', 'Statistiques', 0, '4 leçons · non commencé'],
['6', 'Géométrie dans l\u2019espace', 0, '4 leçons · non commencé']
].map(([n, title, p, meta]) => ({ n, title, meta, pctLabel: p + '%' }));
return { lessons, chapters };
}
}
</script>
</body>
</html>
